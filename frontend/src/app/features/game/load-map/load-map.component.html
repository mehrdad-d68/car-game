<input
  #fileInput
  type="file"
  accept=".json,application/json"
  hidden
  (change)="onFileChosen($event)"
/>
<p-button label="Load Map" severity="secondary" (onClick)="onPick()" />
@if (busy()) {
  <p class="map-note">Validating&hellip;</p>
}
@if (errors(); as errorList) {
  <div class="map-errors">
    <p class="map-note">Map rejected:</p>
    <ul>
      @for (error of errorList; track error) {
        <li>{{ error }}</li>
      }
    </ul>
  </div>
}
